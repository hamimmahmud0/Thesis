<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaggle Manager</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--mut:#667085;--line:#e3e6eb;--acc:#2563eb;--ok:#15803d;--bad:#b42318;--warn:#b54708}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171d2b;--fg:#e6e9f0;--mut:#98a2b3;--line:#283042;--acc:#6ea0ff;--ok:#4ade80;--bad:#f97066;--warn:#fdb022}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
h1{font-size:16px;margin:0 8px 0 0}nav button{background:none;border:0;color:var(--mut);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--bg);color:var(--fg);font-weight:600}main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:500;font-size:12px}
button.b{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}button.b.g{background:none;color:var(--fg);border:1px solid var(--line)}button.b.d{background:var(--bad)}button:disabled{opacity:.5}
input,select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}input[type=number]{width:90px}
.bar{height:8px;background:var(--line);border-radius:4px;min-width:110px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 16px}
label{display:block;color:var(--mut);font-size:12px}label input,label select{display:block;width:100%;margin-top:3px}h2{font-size:14px;margin:0 0 10px}
pre{background:var(--bg);padding:10px;border-radius:6px;overflow:auto;max-height:340px;font-size:12px;margin:0}code{font-size:12px}#err{color:var(--bad);padding:0 20px}
</style></head><body>
<header><h1>Kaggle Manager</h1><nav id="nav"></nav><span style="flex:1"></span><span id="pick" class="tag"></span><button class="b g" onclick="load(true)">Refresh quota</button></header>
<div id="err"></div><main id="main"></main>
<script>
const $=(s,r=document)=>r.querySelector(s);let S=null,tab=localStorage.tab||'dashboard',busy=false;
const TABS=['dashboard','accounts','vms','settings','activity'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,body,method){const r=await fetch(p,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
async function act(fn){$('#err').textContent='';try{busy=true;await fn()}catch(e){$('#err').textContent=e.message}finally{busy=false;await load()}}
async function load(refresh){try{S=await api('/api/state'+(refresh?'?refresh=1':''));draw()}catch(e){$('#err').textContent=e.message}
 try{const p=await api('/api/pick?kind=gpu');$('#pick').textContent='next GPU: '+(p.ranked[0]||'none')}catch{}}
function bar(a){if(a.gpu_remaining==null)return '<span class="bad">'+esc(a.error||'n/a')+'</span>';const p=100*a.gpu_remaining/a.gpu_total;
 return `<div class="row" style="margin:0"><div class="bar"><i style="width:${p}%"></i></div>${a.gpu_remaining.toFixed(1)}h / ${a.gpu_total}h</div>`}
function draw(){$('#nav').innerHTML=TABS.map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';localStorage.tab=tab;draw()">${t}</button>`).join('');
 if(busy)return;$('#main').innerHTML=V[tab]()}
const V={
dashboard(){return `<div class="card"><h2>Accounts &amp; quota</h2><table><tr><th>Account</th><th>Kaggle user</th><th>GPU quota</th><th>Refresh</th><th>State</th></tr>`+
 S.accounts.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.username)}</td><td>${bar(a)}</td><td>${esc((a.gpu_refresh_at||'').replace('T',' '))}</td>
 <td>${!a.enabled?'<span class="tag">disabled</span>':a.cooldown_until?'<span class="tag warn">cooling down</span>':S.vms.some(v=>v.account==a.name)?'<span class="tag ok">VM running</span>':'<span class="tag">idle</span>'}</td></tr>`).join('')+`</table></div>`+
 `<div class="card"><h2>Start a VM</h2><div class="row"><button class="b" onclick="startVm('gpu')">Start GPU VM</button><button class="b g" onclick="startVm('cpu')">Start CPU VM</button><span class="tag">best account is chosen automatically (~1–2 min)</span></div></div>`+V.vms()},
accounts(){return `<div class="card"><h2>Accounts</h2><table><tr><th>Name</th><th>User</th><th>On</th><th>GPU</th><th>CPU</th><th>Priority</th><th></th></tr>`+
 S.accounts.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.username)}</td>
 ${['enabled','gpu','cpu'].map(k=>`<td><input type="checkbox" ${a[k]?'checked':''} onchange="upd('${esc(a.name)}',{${k}:this.checked})"></td>`).join('')}
 <td><input type="number" value="${a.priority}" onchange="upd('${esc(a.name)}',{priority:+this.value})"></td>
 <td><button class="b g" onclick="act(()=>api('/api/accounts/test',{name:'${esc(a.name)}'}))">Test</button>
 <button class="b g bad" onclick="delAcct('${esc(a.name)}')">Remove</button></td></tr>`).join('')+`</table></div>
 <div class="card"><h2>Add account</h2><div class="row"><input id="an" placeholder="name"><input id="at" type="password" placeholder="Kaggle API token (KGAT_…)" size="42">
 <button class="b" onclick="addAcct()">Validate &amp; add</button></div><span class="tag">Higher priority is used first; otherwise the most remaining GPU hours wins. Tokens are stored in .tokens/ and never shown again.</span></div>`},
vms(){return `<div class="card"><h2>Running VMs</h2>`+(S.vms.length?`<table><tr><th>ID</th><th>Kind</th><th>Account</th><th>Uptime</th><th>Idle</th><th>SSH</th><th></th></tr>`+
 S.vms.map(v=>`<tr><td>${esc(v.vm_id)}</td><td>${v.kind}</td><td>${esc(v.account)}</td><td>${v.uptime_min}m</td><td>${v.idle_min}m</td>
 <td><code>${esc(v.ssh_command)}</code> <button class="b g" onclick="navigator.clipboard.writeText('sshpass -p ${esc(v.ssh_password)} ${esc(v.ssh_command)} -o StrictHostKeyChecking=no')">copy</button></td>
 <td><button class="b g" onclick="vlogs('${v.vm_id}')">Logs</button> <button class="b d" onclick="act(()=>api('/api/vms/stop',{vm_id:'${v.vm_id}'}))">Stop</button></td></tr>`).join('')+`</table><pre id="logs" hidden></pre>`:'<span class="tag">none</span>')+`</div>`},
settings(){const s=S.settings,f=(g,k,l,t='number')=>`<label>${l}<input data-g="${g}" data-k="${k}" type="${t}" step="any" value="${esc(s[g][k])}"></label>`;
 return `<div class="card"><h2>Selection</h2><div class="grid">${f('selection','min_gpu_hours','Min GPU hours left')}${f('selection','quota_cache_seconds','Quota cache (s)')}${f('selection','bad_account_seconds','Cool-down after failure (s)')}</div></div>
 <div class="card"><h2>Safety</h2><div class="grid">${f('safety','max_vms','Max concurrent VMs')}${f('safety','idle_stop_minutes','Idle auto-stop (min, 0=off)')}${f('safety','boot_timeout_seconds','Boot timeout (s)')}
 <label>Stop all VMs on exit<select data-g="safety" data-k="stop_all_on_exit" data-bool="1"><option value="false" ${s.safety.stop_all_on_exit?'':'selected'}>no</option><option value="true" ${s.safety.stop_all_on_exit?'selected':''}>yes</option></select></label></div></div>
 <div class="card"><h2>VM / TunnelMate</h2><div class="grid">${['gpu_template','cpu_template','gpu_slug','cpu_slug','ssh_user','broker','broker_host','scope','protocol'].map(k=>f('vm',k,k,'text')).join('')}${f('vm','broker_control_port','broker_control_port')}${f('vm','ssh_local_port','ssh_local_port')}
 <label>HF token (${s.vm.hf_token?'set':'unset'})<input data-g="vm" data-k="hf_token" type="password" placeholder="leave blank to keep"></label></div></div>
 <button class="b" onclick="saveSettings()">Save settings</button> <span class="tag">server host/port changes need a restart</span>`},
activity(){return `<div class="card"><h2>Activity</h2><pre>`+S.events.slice().reverse().map(e=>`${new Date(e.ts*1000).toLocaleTimeString()} [${e.kind}] ${esc(e.msg)}`).join('\n')+`</pre></div>`}};
const startVm=k=>act(async()=>{$('#err').textContent='Starting '+k+' VM… (1–2 min)';await api('/api/vms/start',{kind:k});$('#err').textContent=''});
const upd=(name,p)=>act(()=>api('/api/accounts/update',{name,...p}));
const delAcct=n=>confirm('Remove account '+n+' and delete its token file?')&&act(()=>api('/api/accounts/delete',{name:n}));
const addAcct=()=>act(()=>api('/api/accounts',{name:$('#an').value,token:$('#at').value}));
async function vlogs(id){const el=$('#logs');el.hidden=false;el.textContent='loading…';try{el.textContent=(await api('/api/vms/logs',{vm_id:id})).logs}catch(e){el.textContent=e.message}}
const saveSettings=()=>act(async()=>{const p={};document.querySelectorAll('[data-g]').forEach(el=>{let v=el.value;if(el.dataset.k=='hf_token'&&!v)return;
 if(el.dataset.bool)v=v=='true';else if(el.type=='number')v=Number(v);(p[el.dataset.g]??={})[el.dataset.k]=v});await api('/api/settings',p,'PUT')});
load();setInterval(()=>{if(!busy&&!document.activeElement.closest('input,select'))load()},15000);
</script></body></html>
