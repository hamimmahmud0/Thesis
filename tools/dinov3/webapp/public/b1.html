<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAM_COCO_b1 — frame inspector</title>
<style>
:root{--bg:#101114;--card:#1b1d22;--fg:#eceef2;--mut:#9aa0ab;--line:#2f333b;--acc:#ffd54a}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{font-size:16px}a{color:var(--acc)}.mut{color:var(--mut)}.sp{flex:1}
main{flex:1;display:flex;min-height:0}
aside{width:290px;flex:none;border-right:1px solid var(--line);padding:10px;overflow:auto;display:flex;flex-direction:column;gap:12px}
h3{margin:0 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
#stage{flex:1;position:relative;min-width:0;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
select,button,input{font:inherit;color:var(--fg);background:#24272e;border:1px solid #3a3f49;border-radius:6px;padding:5px 8px}
button{cursor:pointer}button.on{background:var(--acc);color:#000;border-color:var(--acc)}
.cls{display:flex;align-items:center;gap:8px;padding:3px 4px;border-radius:6px;cursor:pointer;user-select:none}
.cls:hover{background:#24272e}.cls.off{opacity:.35}.sw{width:14px;height:14px;border-radius:3px;flex:none}
.cls .n{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:4px;flex-wrap:wrap}
#tip{position:absolute;pointer-events:none;background:#000d;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;display:none;z-index:3;white-space:nowrap}
#info{position:absolute;left:8px;bottom:8px;background:#000b;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;z-index:3}
@media(max-width:800px){main{flex-direction:column}aside{width:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);max-height:42vh}}
</style></head><body>
<header><b>SAM_COCO_b1 · filtered dataset viewer</b><span class="mut" id="meta"></span><span class="sp"></span></header>
<main>
<aside>
 <div><h3>Frame</h3><select id="frame" style="width:100%"></select>
  <div class="seg" style="margin-top:6px"><button id="prev">‹ prev</button><button id="next">next ›</button><button id="fit">fit view</button></div></div>
 <div><h3>Min score <span id="sv" style="color:var(--fg)">0.00</span></h3><input id="score" type="range" min="0" max="1" step="0.01" value="0" style="width:100%"></div>
 <div><h3>Draw</h3><div class="seg"><button id="mO" class="on">outline</button><button id="mF">fill</button><button id="mB">box</button><button id="mL">labels</button></div>
  <div class="mut" style="margin-top:6px;font-size:12px">fill opacity <input id="op" type="range" min="0.05" max="0.8" step="0.05" value="0.3" style="width:90px;vertical-align:middle"></div></div>
 <div><h3>Classes <span class="mut" style="text-transform:none">(click to toggle; white dashed = removed pedestrians)</span></h3><div id="cls"></div>
  <div class="seg" style="margin-top:6px"><button id="all">all</button><button id="none">none</button></div></div>
 <div class="mut" style="font-size:12px;line-height:1.5">Scroll = zoom · drag = pan · hover = details · click an object to pin it.</div>
</aside>
<div id="stage"><canvas id="cv"></canvas><div id="tip"></div><div id="info"></div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const COL={99:"#ffffff",1:"#ff5252",2:"#b388ff",3:"#40c4ff",4:"#ffab40",5:"#69f0ae",6:"#ffeb3b",7:"#ff80ab",8:"#18ffff"};
let D,F=0,img=new Image(),on=new Set(),minS=0,mode={O:true,F:false,B:false,L:false},T={s:1,x:0,y:0},hover=null,pin=null,visible=[];
const cv=$("#cv"),g=cv.getContext("2d");
function resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;draw()}
function fit(){const r=cv.getBoundingClientRect(),f=D.frames[F],s=Math.min(r.width/f.w,r.height/f.h);T={s,x:(r.width-f.w*s)/2,y:(r.height-f.h*s)/2};draw()}
function counts(){const f=D.frames[F],c={};(f.anns||[]).forEach(a=>{if(a.s>=minS)c[a.c]=(c[a.c]||0)+1});return c}
function buildCls(){const c=counts();$("#cls").innerHTML=Object.entries(D.categories).map(([id,n])=>
 `<div class="cls ${on.has(+id)?"":"off"}" data-id="${id}"><span class="sw" style="background:${COL[id]}"></span>${n}<span class="n">${c[id]||0}</span></div>`).join("");
 document.querySelectorAll(".cls").forEach(e=>e.onclick=()=>{const i=+e.dataset.id;on.has(i)?on.delete(i):on.add(i);buildCls();draw()});
 const f=D.frames[F],A=f.anns||[],tot=A.filter(a=>a.s>=minS&&on.has(a.c)).length;
 $("#info").textContent=`${f.file} · ${f.orig[0]}×${f.orig[1]} · showing ${tot} / ${A.length} objects (${f.n} kept + ${f.nr} removed pedestrians)`}
function path(a){g.beginPath();g.setLineDash(a.c==99?[6/T.s,4/T.s]:[]);if(a.p){a.p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath()}else g.rect(a.b[0],a.b[1],a.b[2],a.b[3])}
function draw(){
 const d=devicePixelRatio||1,f=D.frames[F];g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);
 g.setTransform(d*T.s,0,0,d*T.s,d*T.x,d*T.y);if(img.complete&&img.naturalWidth)g.drawImage(img,0,0,f.w,f.h);
 visible=(f.anns||[]).filter(a=>a.s>=minS&&on.has(a.c));const lw=Math.max(1,1.6/T.s),op=+$("#op").value;g.lineJoin="round";
 for(const a of visible){const col=COL[a.c],hi=a===hover||a===pin;
  if(mode.F){path(a);g.globalAlpha=hi?Math.min(.85,op+.3):op;g.fillStyle=col;g.fill();g.globalAlpha=1}
  if(mode.O||hi){path(a);g.lineWidth=hi?lw*2.2:lw;g.strokeStyle=hi?"#fff":col;g.stroke()}
  if(mode.B){g.lineWidth=lw;g.strokeStyle=col;g.strokeRect(a.b[0],a.b[1],a.b[2],a.b[3])}
  if(mode.L&&T.s>0.5){g.font=`${Math.max(9,11/T.s)}px system-ui`;const t=`${D.categories[a.c][0]}${a.s.toFixed(2)}`;g.fillStyle="#000a";
   g.fillRect(a.b[0],a.b[1]-13/T.s,g.measureText(t).width+4/T.s,13/T.s);g.fillStyle=col;g.fillText(t,a.b[0]+2/T.s,a.b[1]-3/T.s)}}}
function inside(a,x,y){if(x<a.b[0]||y<a.b[1]||x>a.b[0]+a.b[2]||y>a.b[1]+a.b[3])return false;if(!a.p)return true;
 let c=false;for(let i=0,j=a.p.length-1;i<a.p.length;j=i++){const [xi,yi]=a.p[i],[xj,yj]=a.p[j];if((yi>y)!=(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function pick(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left-T.x)/T.s,y=(e.clientY-r.top-T.y)/T.s;
 let best=null;for(const a of visible)if(inside(a,x,y)&&(!best||a.b[2]*a.b[3]<best.b[2]*best.b[3]))best=a;return best}
function tipFor(a,e){const t=$("#tip");if(!a){t.style.display="none";return}
 const r=$("#stage").getBoundingClientRect();t.innerHTML=`<b style="color:${COL[a.c]}">${D.categories[a.c]}</b> · score ${a.s.toFixed(3)}<br>id ${a.id} · box ${Math.round(a.b[2]*D.frames[F].orig[0]/D.frames[F].w)}×${Math.round(a.b[3]*D.frames[F].orig[0]/D.frames[F].w)}px`;
 t.style.display="block";t.style.left=Math.min(e.clientX-r.left+14,r.width-200)+"px";t.style.top=(e.clientY-r.top+14)+"px"}
let drag=null,moved=0;
cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,tx:T.x,ty:T.y};moved=0;cv.setPointerCapture(e.pointerId);cv.classList.add("drag")};
cv.onpointermove=e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));T.x=drag.tx+dx;T.y=drag.ty+dy;draw();return}
 const h=pick(e);if(h!==hover){hover=h;draw()}tipFor(pin||h,e)};
cv.onpointerup=e=>{cv.classList.remove("drag");if(drag&&moved<4){const h=pick(e);pin=h===pin?null:h;hover=h;draw();tipFor(pin||h,e)}drag=null};
cv.onpointerleave=()=>{if(!drag){hover=null;if(!pin)tipFor(null);draw()}};
cv.onwheel=e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,k=Math.exp(-e.deltaY*0.0015),ns=Math.min(20,Math.max(.05,T.s*k));
 T.x=mx-(mx-T.x)*ns/T.s;T.y=my-(my-T.y)*ns/T.s;T.s=ns;draw()};
async function load(i){F=(i+D.frames.length)%D.frames.length;$("#frame").value=F;pin=hover=null;tipFor(null);const f=D.frames[F];
 img=new Image();img.onload=()=>{if(F==D.frames.indexOf(f))fit()};img.src="/b1/frames/"+f.name+".jpg";
 if(!f.anns){f.anns=(await (await fetch("/b1/ann/"+f.name+".json")).json()).map(a=>a.r?{...a,c:99}:a)}
 if(D.frames[F]===f){buildCls();draw()}}
$("#frame").onchange=e=>load(+e.target.value);$("#prev").onclick=()=>load(F-1);$("#next").onclick=()=>load(F+1);$("#fit").onclick=fit;
$("#score").oninput=e=>{minS=+e.target.value;$("#sv").textContent=minS.toFixed(2);buildCls();draw()};
$("#op").oninput=draw;
function setMode(k,btn){mode[k]=!mode[k];$(btn).classList.toggle("on",mode[k]);draw()}
$("#mO").onclick=()=>setMode("O","#mO");$("#mF").onclick=()=>setMode("F","#mF");$("#mB").onclick=()=>setMode("B","#mB");$("#mL").onclick=()=>setMode("L","#mL");
$("#all").onclick=()=>{Object.keys(D.categories).forEach(i=>on.add(+i));buildCls();draw()};$("#none").onclick=()=>{on.clear();buildCls();draw()};
addEventListener("keydown",e=>{if(e.key=="ArrowRight")load(F+1);if(e.key=="ArrowLeft")load(F-1)});
addEventListener("resize",resize);
fetch("/b1/index.json").then(r=>r.json()).then(j=>{D=j;D.categories[99]="Removed pedestrian";Object.keys(D.categories).forEach(i=>{if(+i!=99)on.add(+i)});
 $("#frame").innerHTML=D.frames.map((f,i)=>`<option value="${i}">${f.file} (${f.n}+${f.nr})</option>`).join("");
 $("#meta").textContent=`${D.frames.length} frames · ${D.note}`;resize();load(0)});
</script></body></html>
