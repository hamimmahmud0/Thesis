[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segpipe"
version = "1.0.0"
description = "Resumable multi-model segmentation training for Kaggle"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=44",
  "huggingface_hub>=0.35",
  "kaggle>=1.7",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "Pillow>=10",
  "pycocotools>=2.0.10",
  "PyYAML>=6",
  "segmentation-models-pytorch>=0.5",
  "transformers>=4.55",
  "ultralytics>=8.3",
]

[project.scripts]
seg-train = "segpipe.main:main"

[tool.setuptools.packages.find]
include = ["segpipe*"]
